name: networth-local
services:
  db:
    image: postgres:18
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: networth_local
      # Public development-only password, never a deployment credential.
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: networth_local
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U networth_local -d networth_local"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
